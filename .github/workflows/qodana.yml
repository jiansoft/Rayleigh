name: Qodana Code Quality

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          upload-result: false
          args: |
            --linter qodana-cdnet
            --solution jIAnSoft.Rayleigh.slnx
